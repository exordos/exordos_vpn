[project]
name = "exordos_vpn"
description = "Genesis VPN: easy to use VPN for secure access."
readme = "README.md"
authors = [{name = "Genesis Corporation", email = "mail@gmelikov.ru"}]
dynamic = ["version"]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "oslo.config>=3.22.2,<10.0.0",  # Apache-2.0
    "restalchemy>=15.0.0,<16.0.0",  # Apache-2.0
    "gcl_iam>=1.2.1,<2.0.0",  # Apache-2.0
    "gcl_looper>=1.2.3,<=2.0.0",  # Apache-2.0
    "bjoern>=3.2.2",  # BSD License (BSD-3-Clause)
    "Jinja2>=3.1.5,<4.0.0",  # BSD License (BSD-3-Clause)
    "bazooka>=1.3.0,<2.0.0",  # Apache-2.0
    "pyOpenSSL>=25.0.0,<26.0.0",  # Apache-2.0
    "rich>=14.0.0,<15.0.0",  # MIT License (MIT)
    "PrivateBinAPI>=1.0.0,<2.0.0",  # MIT License (MIT)
    "pyotp>=2.9.0,<3.0.0",  # MIT License (MIT)
    "cryptography>=45.0.0,<47.0.0",  # Apache-2.0
    "qrcode>=8.0,<8.1",  # BSD License (BSD-3-Clause)
    "click>=8.0.0,<9.0.0",  # BSD License (BSD-3-Clause)
]

[project.urls]
homepage = "https://github.com/exordos/exordos_vpn/"

[build-system]
requires = [
    "setuptools>=75.3.3",  # last version for python3.8
    "setuptools_scm>=8"
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project.optional-dependencies]
dev = [
    "tox>=4.0.0",
    "tox-uv",
    "pytest>=7.0.0",
]
test = [
    "coverage>=4.0",
    "mock>=3.0.5,<4.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-timer>=1.0.0,<2.0.0",  # MIT License (MIT)
    "flake8>=7.1.2,<8.0.0",  # MIT License (MIT)
]
mypy = [
    "mypy",
]
ruff = [
    "ruff",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "docs",
]

# Same as Black.
line-length = 88
indent-width = 4
# Assume Python 3.8
target-version = "py38"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F"]
ignore = []
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
exordos-vpn-user-api = "exordos_vpn.cmd.user_api:main"
exordos-vpn-bootstrap = "exordos_vpn.cmd.bootstrap:main"
exordos-vpn-cli = "exordos_vpn.cmd.cli:main"
exordos-vpn-server-agent = "exordos_vpn.cmd.server_agent:main"
exordos-vpn-scheduler = "exordos_vpn.cmd.scheduler:main"
exordos-vpn-import-certs = "exordos_vpn.cmd.import_certs:main"

[tool.uv]
package = true

[tool.mypy]
exclude = [
    '.venv',
    'exordos_vpn/tests',
]
python_version = "3.12"
disallow_untyped_defs = true
show_error_codes = true
no_implicit_optional = true
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.setuptools.package-data]
exordos_vpn = ["*.yaml", "*.md"]

[tool.coverage.run]
branch = true
source = [
    "exordos_vpn"
]
command_line = "-m pytest -s exordos_vpn/tests/unit"
omit = [
    "exordos_vpn/tests/*",
    ".venv",
    "memory:0x"
]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",
    "if settings\\.DEBUG",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__:",

    "if TYPE_CHECKING:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

ignore_errors = true

[tool.coverage.html]
directory = "cover"

[tool.coverage.xml]
